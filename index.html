<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Rey of Sunshine</title>
<meta name="description" content="Travel, traveling with dogs, and handmade dog printables, 3D prints and embroidery. New site coming soon.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#fbfaf6;--ink:#1f2a3c;--muted:#5d6676;--sun:#ffc23d;--sun-soft:#fff1c9}
@media (prefers-color-scheme:dark){:root{--bg:#141a24;--ink:#eef0f3;--muted:#a3abb8;--sun:#ffc94f;--sun-soft:#3a3220;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
.sun{width:120px;height:120px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px var(--sun-soft);margin:0 auto 36px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,56px);margin:0 0 12px;letter-spacing:-.02em}
p{color:var(--muted);font-size:18px;max-width:30em;margin:0 auto;line-height:1.6}
</style>
</head>
<body>
<main>
<div class="sun" aria-hidden="true"></div>
<h1>A Rey of Sunshine</h1>
<p>Travel, traveling with dogs, and handmade dog printables, 3D prints and embroidery. The new site is on its way.</p>
</main>
</body>
</html>
